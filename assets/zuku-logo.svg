<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 물방울 그라디언트 (시안 계열 브랜드 컬러) -->
    <linearGradient id="dropGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5CE1E6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3DD8DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C9C9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 하이라이트 그라디언트 -->
    <radialGradient id="highlightGradient" cx="35%" cy="35%" r="30%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    
    <!-- 워드마크 그라디언트 -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5CE1E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3DD8DB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  
  <rect width="800" height="600" fill="#0A0A0F"/>
  
  
  <g transform="translate(400, 180)">
    
    <path d="
      M 0 -110
      C 0 -110, -85 -20, -85 25
      C -85 75, -45 110, 0 110
      C 45 110, 85 75, 85 25
      C 85 -20, 0 -110, 0 -110
      Z
    " fill="url(#dropGradient)"/>
    
    
    <ellipse cx="-25" cy="10" rx="22" ry="28" fill="url(#highlightGradient)" opacity="0.6"/>
    
    
    <ellipse cx="-15" cy="-15" rx="8" ry="10" fill="white" opacity="0.35"/>
  </g>
  
  
  <text 
    x="400" y="380" 
    text-anchor="middle" 
    font-family="'Fredoka', 'Nunito', 'Comfortaa', 'Varela Round', 'Comic Sans MS', sans-serif"
    font-size="120" 
    font-weight="700"
    fill="url(#textGradient)"
    letter-spacing="4"
  >Shizuku</text>
  
  
  <text 
    x="400" y="440" 
    text-anchor="middle" 
    font-family="'Inter', 'Pretendard', -apple-system, sans-serif"
    font-size="28" 
    font-weight="500"
    fill="#5CE1E6"
    opacity="0.6"
    letter-spacing="12"
  >zuku</text>
</svg>
