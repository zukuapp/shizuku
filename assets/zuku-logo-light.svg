<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="dropGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4B8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0097A7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00838F;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="highlightGradientLight" cx="35%" cy="35%" r="30%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="textGradientLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00838F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006064;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 라이트 배경용 -->
  <rect width="800" height="600" fill="#FAFBFC"/>
  
  <!-- 물방울 -->
  <g transform="translate(400, 180)">
    <path d="
      M 0 -110
      C 0 -110, -85 -20, -85 25
      C -85 75, -45 110, 0 110
      C 45 110, 85 75, 85 25
      C 85 -20, 0 -110, 0 -110
      Z
    " fill="url(#dropGradientLight)"/>
    <ellipse cx="-25" cy="10" rx="22" ry="28" fill="url(#highlightGradientLight)" opacity="0.6"/>
    <ellipse cx="-15" cy="-15" rx="8" ry="10" fill="white" opacity="0.4"/>
  </g>
  
  <!-- 워드마크 -->
  <text 
    x="400" y="380" 
    text-anchor="middle" 
    font-family="'Fredoka', 'Nunito', 'Comfortaa', 'Varela Round', 'Comic Sans MS', sans-serif"
    font-size="120" 
    font-weight="700"
    fill="url(#textGradientLight)"
    letter-spacing="4"
  >Shizuku</text>
  
  <text 
    x="400" y="440" 
    text-anchor="middle" 
    font-family="'Inter', 'Pretendard', -apple-system, sans-serif"
    font-size="28" 
    font-weight="500"
    fill="#00838F"
    opacity="0.5"
    letter-spacing="12"
  >zuku</text>
</svg>
