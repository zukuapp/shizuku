<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- 단색 (currentColor 상속) — 아이콘·파비콘용 -->
  <rect width="800" height="600" fill="#0A0A0F"/>
  
  <!-- 물방울 -->
  <g transform="translate(400, 180)">
    <path d="
      M 0 -110
      C 0 -110, -85 -20, -85 25
      C -85 75, -45 110, 0 110
      C 45 110, 85 75, 85 25
      C 85 -20, 0 -110, 0 -110
      Z
    " fill="#FFFFFF"/>
    <ellipse cx="-25" cy="10" rx="22" ry="28" fill="#FFFFFF" opacity="0.3"/>
    <ellipse cx="-15" cy="-15" rx="8" ry="10" fill="#FFFFFF" opacity="0.5"/>
  </g>
  
  <!-- 워드마크 -->
  <text 
    x="400" y="380" 
    text-anchor="middle" 
    font-family="'Fredoka', 'Nunito', 'Comfortaa', 'Varela Round', 'Comic Sans MS', sans-serif"
    font-size="120" 
    font-weight="700"
    fill="#FFFFFF"
    letter-spacing="4"
  >Shizuku</text>
  
  <text 
    x="400" y="440" 
    text-anchor="middle" 
    font-family="'Inter', 'Pretendard', -apple-system, sans-serif"
    font-size="28" 
    font-weight="500"
    fill="#FFFFFF"
    opacity="0.5"
    letter-spacing="12"
  >zuku</text>
</svg>
